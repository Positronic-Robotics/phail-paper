[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "phail-paper"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "huggingface-hub>=1.12.2",
    "matplotlib>=3.10.8",
    "numpy",
    "pos3>=0.2.0",
    "positronic",
    "pyarrow>=23.0.1",
    "scipy",
]

[tool.hatch.build.targets.wheel]
packages = ["build", "toloka"]
